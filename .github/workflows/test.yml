name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
  # The apps ship on iPhone and iPad, and swift test only builds for the Mac:
  # an API that exists on macOS alone compiled here and broke both apps.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild build -scheme SpeechCore-Package -destination 'generic/platform=iOS' -skipMacroValidation -quiet
